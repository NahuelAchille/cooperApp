<style>
  #main-header {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
    height: 10vh;
    border-bottom: 2px solid #ccc;
    padding: 0 20px;
  }
  #logo { display: flex; align-items: center; gap: 10px; }
  #logo img { height: 9vh; }
  #logo h1 { font-size: 1.3rem; margin: 0; color: #2d7a4f; font-weight: 700; }

  #main-nav ul {
    margin: 0; padding: 0; list-style: none;
    display: flex; gap: 4px; height: 10vh; align-items: stretch;
  }
  #main-nav ul li { display: flex; align-items: center; }
  #main-nav ul li a {
    display: block; padding: 0 16px; height: 100%;
    line-height: 10vh; color: #333; font-size: 0.95rem;
    text-decoration: none; transition: background-color 0.2s;
  }
  #main-nav ul li a:hover { background-color: #e4f2eb; color: #2d7a4f; }

  /* Dropdown usuario */
  .user-dropdown-btn {
    display: flex; align-items: center; gap: 8px;
    background: none; border: 1.5px solid #c8e6d5;
    border-radius: 8px; padding: 7px 14px; cursor: pointer;
    color: #2d7a4f; font-weight: 600; font-size: 0.9rem;
    transition: background 0.2s;
  }
  .user-dropdown-btn:hover { background-color: #e4f2eb; }
  .user-dropdown-btn .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: linear-gradient(135deg, #2d7a4f, #19de75);
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 0.8rem; font-weight: bold;
  }
  .dropdown-menu { border: none; box-shadow: 0 4px 16px rgba(0,0,0,0.12); border-radius: 10px; min-width: 200px; }
  .dropdown-item { color: #1a2e23; padding: 10px 16px; font-size: 0.9rem; }
  .dropdown-item:hover { background-color: #e4f2eb; color: #2d7a4f; }
  .dropdown-item.text-danger:hover { background-color: #fde8e8; }
  .dropdown-divider { border-color: #e4f2eb; }
  .dropdown-header { color: #2d7a4f; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
</style>

<header id="main-header">
  <section id="logo">
    <img src="/images/Logo.png" alt="Logo de la empresa">
    <h1>CooperApp</h1>
  </section>

  <nav id="main-nav">
    <ul>
      <li><a href="/pages/dashboard.html">Panel general</a></li>
      <li><a href="/pages/usuarios.html">Usuarios</a></li>
      <li><a href="#">Movimientos</a></li>
      <li><a href="#">Stock</a></li>
      <li><a href="#">Reportes</a></li>
      <li><a href="#">Articulación</a></li>
    </ul>
  </nav>

  <div class="dropdown" id="user-dropdown">
    <button class="user-dropdown-btn dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
      <span class="avatar" id="user-avatar">?</span>
      <span id="user-nombre">Cargando...</span>
    </button>
    <ul class="dropdown-menu dropdown-menu-end" id="dropdown-menu">
      <li><h6 class="dropdown-header" id="dropdown-coop"></h6></li>
      <li><hr class="dropdown-divider"></li>
      <li id="item-usuarios" class="d-none">
        <a class="dropdown-item" href="/pages/usuarios.html">
          <i class="fa-solid fa-users me-2"></i>Gestión de usuarios
        </a>
      </li>
      <li id="item-superadmin" class="d-none">
        <a class="dropdown-item" href="/pages/superadmin.html">
          <i class="fa-solid fa-shield-halved me-2"></i>Panel administración
        </a>
      </li>
      <li><hr class="dropdown-divider"></li>
      <li>
        <a class="dropdown-item text-danger" href="/users/logout">
          <i class="fa-solid fa-right-from-bracket me-2"></i>Cerrar sesión
        </a>
      </li>
    </ul>
  </div>
</header>
