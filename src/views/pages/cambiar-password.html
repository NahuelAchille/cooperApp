<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/styles/comun.css">
  <!-- Las mismas hojas que el login (14/11/2026): antes usaba styles.css, una
       hoja de 700 líneas del diseño viejo de la que sólo servían 120, y era la
       única pantalla con ese aspecto. -->
  <link rel="stylesheet" href="/styles/base.css">
  <link rel="stylesheet" href="/styles/login.css">
  <title>Cambiar contraseña - CooperApp</title>
</head>
<body class="fondo-login-con-lineas">
  <main>
    <div class="marca-login">
      <img src="/images/Logo.png" alt="">
      <span>CooperApp</span>
    </div>
    <h1>Elegí tu contraseña</h1>
    <!-- No siempre es el primer ingreso: también se llega acá cuando el
         administrador te vuelve a la contraseña inicial (tu DNI). -->
    <p class="text-white text-center mb-0" style="max-width:360px;">
      Entraste con la contraseña inicial (tu DNI). Antes de seguir, elegí una que
      sepas sólo vos. Tiene que tener al menos 6 caracteres.
    </p>

    <form class="main-input" id="form-cambiar">
      <section id="formulario-login">
        <div class="input-con-icono">
          <input type="password" id="password-nuevo" placeholder="Contraseña nueva" autocomplete="new-password" required>
          <i class="fa-solid fa-lock"></i>
        </div>
        <div class="input-con-icono" style="margin-top:12px;">
          <input type="password" id="password-confirm" placeholder="Repetila" autocomplete="new-password" required>
          <i class="fa-solid fa-lock"></i>
        </div>
        <div id="error-msg" class="small mt-2 d-none" style="color:#ffd166;font-weight:600;"></div>
      </section>
      <section id="boton-login">
        <button type="submit">Guardar contraseña</button>
      </section>
    </form>
  </main>

  <script>

    // Esta pantalla es para el primer ingreso. Con una contraseña propia, el
    // servidor pide la actual y acá no hay dónde escribirla: se va al panel
    // (QA entrega 3, B4). Sin sesión, al login.
    fetch('/users/me').then(async r => {
      if (r.status === 401) { location.href = '/pages/login.html'; return }
      const yo = await r.json().catch(() => null)
      if (yo && !yo.debe_cambiar_password) location.href = '/pages/dashboard.html'
    }).catch(() => {})

    document.getElementById('form-cambiar').addEventListener('submit', async (e) => {

      e.preventDefault()

      const nuevo = document.getElementById('password-nuevo').value
      const confirm = document.getElementById('password-confirm').value
      const errorDiv = document.getElementById('error-msg')
      const mostrarError = (texto) => {
        errorDiv.textContent = texto
        errorDiv.classList.remove('d-none')
      }

      errorDiv.classList.add('d-none')

      if (nuevo !== confirm) return mostrarError('Las dos contraseñas no son iguales.')

      const res = await fetch('/users/cambiar-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password_nuevo: nuevo, password_confirm: confirm })
      })

      const data = await res.json().catch(() => ({}))
      if (res.ok) {
        window.location.href = data.redirect
      } else if (res.status === 401) {
        // La sesión se venció: sin esto el error quedaba sin explicar.
        window.location.href = '/pages/login.html'
      } else {
        mostrarError(data.error || 'No se pudo guardar. Probá de nuevo.')
      }
    })

  </script>
</body>
</html>
