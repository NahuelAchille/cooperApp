<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/styles/styles.css">
  <title>Cambiar contraseña - CooperApp</title>
</head>
<body class="fondo-login-con-lineas">
  <main>
    <h1>Cambiá tu contraseña</h1>
    <p style="color:rgba(255,255,255,0.8); text-align:center; max-width:360px; margin:0;">
      Es tu primer ingreso. Por seguridad, debe establecer una contraseña personal
    </p>

    <form class="main-input" id="form-cambiar" style="margin-top:10px;">
      <section id="formulario-login">
        <div class="input-con-icono">
          <input type="password" id="password-nuevo" placeholder="Nueva contraseña" autocomplete="new-password" required>
          <i class="fa-solid fa-lock"></i>
        </div>
        <div class="input-con-icono" style="margin-top:12px;">
          <input type="password" id="password-confirm" placeholder="Confirmar contraseña" autocomplete="new-password" required>
          <i class="fa-solid fa-lock"></i>
        </div>
        <div id="error-msg" style="color:#ffcccc; font-size:0.85rem; margin-top:8px; display:none;"></div>
      </section>
      <section id="boton-login">
        <button type="submit">Guardar contraseña</button>
      </section>
    </form>
  </main>

  <script>

    document.getElementById('form-cambiar').addEventListener('submit', async (e) => {

      e.preventDefault()

      const nuevo = document.getElementById('password-nuevo').value
      const confirm = document.getElementById('password-confirm').value
      const errorDiv = document.getElementById('error-msg')

      errorDiv.style.display = 'none'

      if (nuevo !== confirm) {
        errorDiv.textContent = 'Las contraseñas no coinciden.'
        errorDiv.style.display = 'block'
        return
      }

      const res = await fetch('/users/cambiar-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password_nuevo: nuevo, password_confirm: confirm })
      })

      const data = await res.json()
      if (res.ok) {
        window.location.href = data.redirect
      } else {
        errorDiv.textContent = data.error
        errorDiv.style.display = 'block'
      }
    })

  </script>
</body>
</html>
