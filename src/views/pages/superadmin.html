<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/styles/styles.css">
  <title>Panel Superadmin - CooperApp</title>
  <style>
    body { background-color: #f0f7f3; color: #1a2e23; }

    .sidebar {
      width: 230px; min-height: 100vh;
      background-color: #2d7a4f;
      box-shadow: 3px 0 12px rgba(0,0,0,0.15);
    }
    .sidebar .nav-link { color: rgba(255,255,255,0.85); border-radius: 8px; font-weight: 500; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active {
      background-color: rgba(255,255,255,0.15);
      color: #fff;
    }

    .badge-pendiente { background-color: rgba(255,255,255,0.25); color: white; }

    .content-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      padding: 24px;
    }

    .table thead th {
      background-color: #e4f2eb;
      color: #2d7a4f;
      border-bottom: 2px solid #a8d5bc;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .table tbody tr:hover { background-color: #f2faf6; }
    .table td { vertical-align: middle; color: #1a2e23; }

    .btn-aprobar {
      background-color: #2d7a4f;
      color: white; border: none; border-radius: 6px;
    }
    .btn-aprobar:hover { background-color: #235f3d; color: white; }
    .btn-rechazar {
      background: transparent;
      color: #c0392b; border: 1.5px solid #c0392b; border-radius: 6px;
    }
    .btn-rechazar:hover { background-color: #c0392b; color: white; }

    /* Modal */
    .modal-content { border-radius: 12px; overflow: hidden; border: none; }
    .modal-header { background-color: #2d7a4f; color: white; border: none; }
    .modal-footer { background-color: #f0f7f3; border-top: 1px solid #c8e6d5; }
    .modal-body dl dt { color: #2d7a4f; }

    /* Título sección */
    .seccion-titulo { color: #2d7a4f; font-weight: 700; }
  </style>
</head>
<body>

<div id="header"></div>
<script>
fetch('/components/header.html')
  .then(res => res.text())
  .then(html => {
    document.getElementById('header').innerHTML = html;
    fetch('/users/me')
      .then(r => r.json())
      .then(user => {
        if (!user || user.error) return;
        const iniciales = (user.nombre[0] + user.apellido[0]).toUpperCase();
        document.getElementById('user-avatar').textContent = iniciales;
        document.getElementById('user-nombre').textContent = `${user.nombre} ${user.apellido}`;
        document.getElementById('dropdown-coop').textContent = user.cooperativa?.nombre || '';
        if (user.rol === 'admin_cooperativa' || user.rol === 'superadmin') {
          document.getElementById('item-usuarios').classList.remove('d-none');
        }
        if (user.rol === 'superadmin') {
          document.getElementById('item-superadmin').classList.remove('d-none');
        }
      });
  });
</script>

<div class="d-flex">

  <!-- Sidebar -->
  <div class="sidebar d-flex flex-column p-3">
    <div class="text-center mb-4 mt-2">
      <img src="/images/Logo.png" alt="Logo" height="50">
      <div class="small mt-2 text-white-50">Panel Superadmin</div>
    </div>
    <ul class="nav flex-column gap-1">
      <li class="nav-item">
        <a href="#" class="nav-link active" data-section="pendientes">
          <i class="fa-solid fa-clock-rotate-left me-2"></i>Pendientes
          <span class="badge badge-pendiente ms-1" id="badge-pendientes">0</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="#" class="nav-link" data-section="todas">
          <i class="fa-solid fa-building me-2"></i>Todas las cooperativas
        </a>
      </li>
    </ul>
    <div class="mt-auto">
      <a href="/users/logout" class="btn btn-sm w-100 fw-bold" style="background:rgba(255,255,255,0.2);color:white;border:1px solid rgba(255,255,255,0.4);">
        <i class="fa-solid fa-right-from-bracket me-1"></i>Salir
      </a>
    </div>
  </div>

  <!-- Contenido -->
  <div class="flex-grow-1 p-4">

    <!-- Sección: Pendientes -->
    <div id="section-pendientes">
      <h4 class="mb-4 seccion-titulo">
        <i class="fa-solid fa-clock-rotate-left me-2"></i>Cooperativas pendientes de aprobación
      </h4>
      <div id="lista-pendientes" class="content-card">
        <div class="text-center py-5" style="color:#19de75;">
          <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
        </div>
      </div>
    </div>

    <!-- Sección: Todas -->
    <div id="section-todas" class="d-none">
      <h4 class="mb-4 seccion-titulo">
        <i class="fa-solid fa-building me-2"></i>Todas las cooperativas
      </h4>
      <div id="lista-todas" class="content-card">
        <div class="text-center py-5" style="color:#19de75;">
          <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Modal detalle -->
<div class="modal fade" id="modalDetalle" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold" id="modal-titulo">Detalle de cooperativa</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const modalDetalle = new bootstrap.Modal(document.getElementById('modalDetalle'));

  // Navegación entre secciones
  document.querySelectorAll('[data-section]').forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      document.querySelectorAll('[data-section]').forEach(l => l.classList.remove('active'));
      link.classList.add('active');
      document.getElementById('section-pendientes').classList.add('d-none');
      document.getElementById('section-todas').classList.add('d-none');
      document.getElementById(`section-${link.dataset.section}`).classList.remove('d-none');
    });
  });

  // Cargar pendientes
  async function cargarPendientes() {
    const res = await fetch('/cooperativas/pendientes');
    const data = await res.json();

    document.getElementById('badge-pendientes').textContent = data.length;

    const container = document.getElementById('lista-pendientes');
    if (data.length === 0) {
      container.innerHTML = '<div class="alert alert-success">No hay cooperativas pendientes.</div>';
      return;
    }

    container.innerHTML = `
      <div class="table-responsive">
        <table class="table table-hover">
          <thead><tr>
            <th>Cooperativa</th><th>CUIT</th><th>Email</th><th>Administrador</th><th class="text-center">Acciones</th>
          </tr></thead>
          <tbody>
            ${data.map(c => `
              <tr>
                <td><strong>${c.nombre}</strong></td>
                <td>${c.cuit}</td>
                <td>${c.email}</td>
                <td>${c.admin_nombre ? `${c.admin_nombre} ${c.admin_apellido}` : '-'}</td>
                <td class="text-center">
                  <button class="btn btn-sm btn-outline-secondary me-1" onclick="verDetalle(${JSON.stringify(c).replace(/"/g, '&quot;')})">
                    <i class="fa-solid fa-eye"></i>
                  </button>
                  <button class="btn btn-sm btn-aprobar me-1" onclick="aprobar(${c.id_cooperativa})">
                    <i class="fa-solid fa-check"></i> Aprobar
                  </button>
                  <button class="btn btn-sm btn-rechazar" onclick="rechazar(${c.id_cooperativa})">
                    <i class="fa-solid fa-xmark"></i> Rechazar
                  </button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
  }

  // Cargar todas
  async function cargarTodas() {
    const res = await fetch('/cooperativas');
    const data = await res.json();
    const container = document.getElementById('lista-todas');

    const estadoBadge = (e) => ({
      activa: '<span class="badge bg-success">Activa</span>',
      pendiente: '<span class="badge bg-warning text-dark">Pendiente</span>',
      suspendida: '<span class="badge bg-danger">Suspendida</span>'
    }[e] || e);

    container.innerHTML = `
      <div class="table-responsive">
        <table class="table table-hover">
          <thead><tr>
            <th>Cooperativa</th><th>CUIT</th><th>Email</th><th>Usuarios</th><th>Estado</th>
          </tr></thead>
          <tbody>
            ${data.map(c => `
              <tr>
                <td><strong>${c.nombre}</strong></td>
                <td>${c.cuit}</td>
                <td>${c.email}</td>
                <td class="text-center">${c.cantidad_usuarios}</td>
                <td>${estadoBadge(c.estado)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>`;
  }

  function verDetalle(c) {
    document.getElementById('modal-titulo').textContent = c.nombre;
    document.getElementById('modal-body').innerHTML = `
      <dl class="row mb-0">
        <dt class="col-5">CUIT</dt><dd class="col-7">${c.cuit}</dd>
        <dt class="col-5">Email</dt><dd class="col-7">${c.email}</dd>
        <dt class="col-5">Matrícula</dt><dd class="col-7">${c.matricula}</dd>
        <dt class="col-5">Domicilio</dt><dd class="col-7">${c.domicilio || '-'}</dd>
        <dt class="col-5">Federación</dt><dd class="col-7">${c.federacion || '-'}</dd>
        <dt class="col-5">Administrador</dt><dd class="col-7">${c.admin_nombre ? `${c.admin_nombre} ${c.admin_apellido}` : '-'}</dd>
        <dt class="col-5">Email admin</dt><dd class="col-7">${c.admin_email || '-'}</dd>
      </dl>`;
    document.getElementById('modal-footer').innerHTML = `
      <button class="btn btn-success" onclick="aprobar(${c.id_cooperativa}); bootstrap.Modal.getInstance(document.getElementById('modalDetalle')).hide()">
        <i class="fa-solid fa-check me-1"></i>Aprobar
      </button>
      <button class="btn btn-danger" onclick="rechazar(${c.id_cooperativa}); bootstrap.Modal.getInstance(document.getElementById('modalDetalle')).hide()">
        <i class="fa-solid fa-xmark me-1"></i>Rechazar
      </button>`;
    modalDetalle.show();
  }

  async function aprobar(id) {
    await fetch(`/cooperativas/${id}/aprobar`, { method: 'PUT' });
    cargarPendientes();
    cargarTodas();
  }

  async function rechazar(id) {
    await fetch(`/cooperativas/${id}/rechazar`, { method: 'PUT' });
    cargarPendientes();
    cargarTodas();
  }

  // Carga inicial
  cargarPendientes();
  cargarTodas();
</script>
</body>
</html>
