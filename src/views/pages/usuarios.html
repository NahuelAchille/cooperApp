<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/styles/styles.css">
  <title>Usuarios - CooperApp</title>
  <style>
    body { background-color: #f0f7f3; }

    .page-header {
      background: linear-gradient(135deg, #2d7a4f, #3a9e65);
      color: white;
      padding: 20px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .content { padding: 32px; }

    .card-tabla {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      overflow: hidden;
    }

    .table thead th {
      background-color: #e4f2eb;
      color: #2d7a4f;
      border-bottom: 2px solid #a8d5bc;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .table td { vertical-align: middle; color: #1a2e23; }
    .table tbody tr:hover { background-color: #f2faf6; }

    .badge-rol {
      background-color: #e4f2eb;
      color: #2d7a4f;
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }
    .badge-activo   { background-color: #d1f5e0; color: #1a6b3a; }
    .badge-inactivo { background-color: #fde8e8; color: #a01c1c; }
    .badge-temp     { background-color: #fff3cd; color: #856404; }

    .btn-nuevo {
      background: white;
      color: #2d7a4f;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      padding: 8px 20px;
    }
    .btn-nuevo:hover { background-color: #e4f2eb; color: #2d7a4f; }

    /* Modal */
    .modal-content { border-radius: 12px; overflow: hidden; border: none; }
    .modal-header { background-color: #2d7a4f; color: white; border: none; }
    .modal-footer { background-color: #f0f7f3; border-top: 1px solid #c8e6d5; }
    .form-label { color: #2d7a4f; font-size: 0.85rem; font-weight: 600; }
    .form-control:focus, .form-select:focus {
      border-color: #2d7a4f;
      box-shadow: 0 0 0 3px rgba(45,122,79,0.15);
    }
  </style>
</head>
<body>

  <div id="header"></div>
  <script>
  fetch('/components/header.html')
    .then(res => res.text())
    .then(html => {
      document.getElementById('header').innerHTML = html;
      fetch('/users/me')
        .then(r => r.json())
        .then(user => {
          if (!user || user.error) return;
          const iniciales = (user.nombre[0] + user.apellido[0]).toUpperCase();
          document.getElementById('user-avatar').textContent = iniciales;
          document.getElementById('user-nombre').textContent = `${user.nombre} ${user.apellido}`;
          document.getElementById('dropdown-coop').textContent = user.cooperativa?.nombre || '';
          if (user.rol === 'admin_cooperativa' || user.rol === 'superadmin') {
            document.getElementById('item-usuarios').classList.remove('d-none');
          }
          if (user.rol === 'superadmin') {
            document.getElementById('item-superadmin').classList.remove('d-none');
          }

          // Solo admin puede crear usuarios
          if (user.rol !== 'admin_cooperativa' && user.rol !== 'superadmin') {
            document.getElementById('btn-nuevo-usuario').style.display = 'none';
          }

          document.getElementById('nombre-cooperativa').textContent = user.cooperativa?.nombre || '';
        });
    });
  </script>

  <div class="page-header">
    <div>
      <h4 class="mb-0 fw-bold"><i class="fa-solid fa-users me-2"></i>Usuarios de la cooperativa</h4>
      <small style="opacity:0.8;" id="nombre-cooperativa"></small>
    </div>
    <button class="btn btn-nuevo" id="btn-nuevo-usuario" data-bs-toggle="modal" data-bs-target="#modalNuevoUsuario">
      <i class="fa-solid fa-user-plus me-2"></i>Nuevo usuario
    </button>
  </div>

  <div class="content">
    <div class="card-tabla">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Email</th>
              <th>DNI</th>
              <th>Rol</th>
              <th>Estado</th>
              <th>Fecha registro</th>
            </tr>
          </thead>
          <tbody id="tabla-usuarios">
            <tr><td colspan="6" class="text-center py-4 text-muted">
              <i class="fa-solid fa-spinner fa-spin me-2"></i>Cargando...
            </td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal nuevo usuario -->
  <div class="modal fade" id="modalNuevoUsuario" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold"><i class="fa-solid fa-user-plus me-2"></i>Nuevo usuario</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="form-nuevo-usuario" novalidate autocomplete="new-password">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" name="nombre" placeholder="Juan" autocomplete="new-password" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Apellido</label>
                <input type="text" class="form-control" name="apellido" placeholder="Pérez" autocomplete="new-password" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email" placeholder="juan@coop.com" autocomplete="new-password" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">DNI</label>
                <input type="text" class="form-control" name="dni" placeholder="12345678" autocomplete="new-password" required>
              </div>
              <div class="col-12">
                <label class="form-label">Rol</label>
                <select class="form-select" name="id_rol" required>
                  <option value="">Seleccioná un rol...</option>
                  <option value="3">Operador</option>
                </select>
              </div>
            </div>
            <div class="alert alert-warning mt-3 mb-0 py-2 small">
              <i class="fa-solid fa-circle-info me-1"></i>
              La contraseña temporal será el <strong>DNI</strong> del usuario. Deberá cambiarla en el primer ingreso.
            </div>
            <div id="form-error" class="text-danger small mt-2 d-none"></div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" id="btn-crear-usuario" class="btn fw-bold px-4" style="background-color:#2d7a4f;color:white;">
            <i class="fa-solid fa-user-plus me-2"></i>Crear usuario
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    fetch('/components/header.html')
      .then(r => r.text())
      .then(html => document.getElementById('header').innerHTML = html);

    fetch('/users/me')
      .then(r => r.json())
      .then(user => {
        document.getElementById('nombre-cooperativa').textContent = user.cooperativa?.nombre || '';
      });

    async function cargarUsuarios() {
      const res = await fetch('/users');
      const data = await res.json();
      const tbody = document.getElementById('tabla-usuarios');

      if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">No hay usuarios registrados.</td></tr>';
        return;
      }

      tbody.innerHTML = data.map(u => `
        <tr>
          <td><strong>${u.nombre} ${u.apellido}</strong></td>
          <td>${u.email}</td>
          <td>${u.dni}</td>
          <td><span class="badge-rol">${u.rol}</span></td>
          <td>
            ${u.debe_cambiar_password
              ? '<span class="badge-temp">Contraseña temporal</span>'
              : u.activo
                ? '<span class="badge-activo">Activo</span>'
                : '<span class="badge-inactivo">Inactivo</span>'
            }
          </td>
          <td>${new Date(u.fecha_registro).toLocaleDateString('es-AR')}</td>
        </tr>
      `).join('');
    }

    document.getElementById('btn-crear-usuario').addEventListener('click', async () => {
      const form = document.getElementById('form-nuevo-usuario');
      const errorDiv = document.getElementById('form-error');
      errorDiv.classList.add('d-none');

      const data = Object.fromEntries(new FormData(form));

      if (!data.nombre || !data.apellido || !data.email || !data.dni || !data.id_rol) {
        errorDiv.textContent = 'Completá todos los campos.';
        errorDiv.classList.remove('d-none');
        return;
      }

      const res = await fetch('/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      const result = await res.json();

      if (res.ok) {
        bootstrap.Modal.getInstance(document.getElementById('modalNuevoUsuario')).hide();
        form.reset();
        cargarUsuarios();
        // Toast de éxito
        const toast = document.createElement('div');
        toast.style = 'position:fixed;top:24px;left:50%;transform:translateX(-50%);background:#2d7a4f;color:white;padding:14px 24px;border-radius:10px;z-index:9999;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,0.2)';
        toast.innerHTML = `<i class="fa-solid fa-circle-check me-2"></i>${result.message}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 4000);
      } else {
        errorDiv.textContent = result.error;
        errorDiv.classList.remove('d-none');
      }
    });

    cargarUsuarios();
  </script>
</body>
</html>
